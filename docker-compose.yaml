services:
  tempo:
    image: grafana/tempo:2.4.1
    ports:
      - "4318:4318"
      - "4317:4317" 
      - "3200:3200"
    command: ["--config.file=/etc/tempo.yaml"]
    volumes:
      - ./tempo/tempo.yaml:/etc/tempo.yaml

  grafana:
    image: grafana/grafana:latest
    ports:
      - "3000:3000"
