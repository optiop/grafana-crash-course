services:
  grafana:
    image: grafana/grafana:11.4.0
    environment:
      GF_LOG_LEVEL: critical
      GF_SECURITY_ADMIN_USER: admin
      GF_SECURITY_ADMIN_PASSWORD: grafana
      GF_SECURITY_ALLOW_EMBEDDING: true
      GF_AUTH_GENERIC_OAUTH_ENABLED: true
      GF_AUTH_GENERIC_OAUTH_NAME: Keycloak
      GF_AUTH_GENERIC_OAUTH_ALLOW_SIGN_UP: true
      GF_AUTH_GENERIC_OAUTH_AUTO_LOGIN: false
      GF_AUTH_GENERIC_OAUTH_CLIENT_ID: dashboard
      GF_AUTH_GENERIC_OAUTH_CLIENT_SECRET: cwrCP1uLwxo2IZSFewg1BTf3BgiUsZQp 
      GF_AUTH_GENERIC_OAUTH_SCOPES: "openid email profile offline_access roles"
      GF_AUTH_GENERIC_OAUTH_EMAIL_ATTRIBUTE_PATH: email
      GF_AUTH_GENERIC_OAUTH_AUTH_URL: http://54.87.224.14:8080/realms/imbue-sustainability/protocol/openid-connect/auth
      GF_AUTH_GENERIC_OAUTH_TOKEN_URL: http:/54.87.224.14:8080/realms/imbue-sustainability/protocol/openid-connect/token
      GF_AUTH_GENERIC_OAUTH_API_URL: http://54.87.224.14:8080/realms/imbue-sustainability/protocol/openid-connect/userinfo
      GF_SERVER_DOMAIN: 54.87.224.14
      GF_SERVER_ROOT_URL: http://54.87.224.14:3000/
      GF_AUTH_OAUTH_ALLOW_INSECURE_EMAIL_LOOKUP: true
      GF_AUTH_GENERIC_OAUTH_REDIRECT_URI: http://54.242.94.211/:3000/login/generic_oauth
        #GF_AUTH_GENERIC_OAUTH_ROLE_ATTRIBUTE_PATH: contains(realm_access.roles[*], 'Admin') && 'Admin' || contains(realm_access.roles[*], 'Editor') && 'Editor' || 'Viewer'
    ports:
      - 3000:3000
      
  keycloak:
    image: quay.io/keycloak/keycloak:23.0
    command: start-dev --import-realm
    environment:
      KC_DB: postgres
      KC_DB_URL_HOST: postgres
      KC_DB_URL_PORT: "5432"
      KC_DB_URL_DATABASE: keycloak
      KC_DB_USERNAME: keycloak
      KC_DB_PASSWORD: passw0rd
      KC_HOSTNAME: http://54.87.224.14
      KC_FEATURES: preview
      KEYCLOAK_ADMIN: admin
      KEYCLOAK_ADMIN_PASSWORD: admin
      KC_HOSTNAME_STRICT: false
      KC_PROXY: none
      KC_HOSTNAME_STRICT_HTTPS: false
      KC_HTTP_ENABLED: true
    ports:
      - "8080:8080"
    volumes:
      - ./keycloak/certs:/opt/keycloak/certs
      - ./keycloak/demo-realm.json:/opt/keycloak/data/import/demo-realm.json

  postgres:
    image: docker.io/postgres:15
    environment:
      POSTGRES_USER: keycloak
      POSTGRES_PASSWORD: passw0rd
    ports:
      - "5432:5432"
    volumes:
      - ./postgres/data:/var/lib/postgresql/data
