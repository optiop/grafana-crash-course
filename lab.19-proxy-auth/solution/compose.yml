name: Auth-proxy

services:
  grafana:
    image: grafana/grafana
    container_name: grafana
    ports:
      - 3000:3000
    hostname: grafana
    volumes:
      - ./grafana/grafana.ini:/etc/grafana/grafana.ini

  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    ports:
      - 5000:5000
    hostname: backend

  nginx:
    image: nginx:latest
    ports:
      - 8080:80
    hostname: nginx
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf
