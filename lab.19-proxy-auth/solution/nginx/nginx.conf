user nginx;
worker_processes auto;
error_log /proc/self/fd/2 warn;
pid /var/run/nginx.pid;

events {
    worker_connections 1024;
}

http {
    include /etc/nginx/mime.types;
    default_type application/octet-stream;

    access_log /proc/self/fd/1 combined;

    proxy_set_header Authorization "";

    # Proxy settings
    proxy_http_version 1.1;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;

    map $http_upgrade $connection_upgrade {
        default upgrade;
        '' close;
    }

    server {
        listen 80;
        server_name localhost;

        error_page 404 /404.html;

        location / {
            proxy_pass http://backend:5000/;
        }

        location /main {
            try_files $uri $uri/ =404;
        }

        location /grafana {
            auth_request /auth;
            auth_request_set $auth_user $upstream_http_x_webauth_user;
            proxy_set_header X-WEBAUTH-USER $auth_user;

            error_page 401 = @error401;
            proxy_pass http://grafana:3000;
            proxy_redirect off;
        }

        location @error401 {
            return 302 http://localhost:8080/;
        }

        location = /auth {
            proxy_pass http://backend:5000/access;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $cookie_header;
        }

        location /grafana/logout {
            proxy_pass http://backend:5000/logout;
            proxy_set_header Cookie $http_cookie;
            proxy_pass_request_body off;
            proxy_set_header Content-Length "";
            proxy_set_header X-Original-URI $request_uri;
            proxy_set_header Authorization $http_authorization;
            proxy_set_header Cookie $cookie_header;
        }
    }
}
