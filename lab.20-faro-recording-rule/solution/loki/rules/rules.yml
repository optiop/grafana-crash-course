groups:
  - name: faro
    interval: 30s
    rules:
      - record: ttfb
        expr: avg_over_time({kind="measurement"} |= `ttfb` | logfmt | unwrap ttfb [30s]) by (app)
        labels:
          cluster: "us-central1"
      - record: fcp
        expr: avg_over_time({kind="measurement"} |= " fcp=" | logfmt | unwrap fcp [30s]) by (app)
        labels:
          cluster: "us-central1"
      - record: cls
        expr: avg_over_time({kind="measurement"} |= "cls" | logfmt | unwrap cls [5m]) by (app)
        labels:
          cluster: "us-central1"
      - record: lcp
        expr: avg_over_time({kind="measurement"} |= "lcp=" | logfmt | unwrap lcp [5m]) by (app)
        labels:
          cluster: "us-central1"
      - record: fid
        expr: avg_over_time({kind="measurement"} |= "fid=" | logfmt | unwrap fid [5m]) by (app)
        labels:
          cluster: "us-central1"
      - record: inp
        expr: avg_over_time({kind="measurement"} |= "inp=" | logfmt | unwrap inp [5m]) by (app)
        labels:
          cluster: "us-central1"
      - record: totalvisits
        expr: count_over_time({kind="measurement"} |= " ttfb=" [30d])
        labels:
          cluster: "us-central1"
      - record: exceptions
        expr : count_over_time({kind="exception"} [30s])
        labels:
          cluster: "us-central1"
      - record: log_exceptions:rate_30s
        expr: sum(rate({kind="exception"}[30s])) by (app)
        labels:
          cluster: "us-central1"
      - record: topbrowsers
        expr: |
         topk(
          10, 
          count by (
            cluster,
            app,
            version,
            browser_name,
            browser_version
          ) (count_over_time({kind="measurement"} | logfmt [5m])))
        labels:
          cluster: "us-central1"