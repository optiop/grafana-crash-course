apiVersion: v1
kind: Service
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  type: ClusterIP
  selector:
    app: tempo
  ports:
    - name: http-otlp
      port: 4318
      targetPort: 4318
    - name: grpc-otlp
      port: 4317
      targetPort: 4317
    - name: ui
      port: 3200
      targetPort: 3200
    - name: query-frontend
      port: 9095
      targetPort: 9095
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: tempo
  labels:
    app: tempo
spec:
  replicas: 1
  selector:
    matchLabels:
      app: tempo
  template:
    metadata:
      labels:
        app: tempo
    spec:
      containers:
        - name: tempo
          image: grafana/tempo:2.4.1
          args: ["--config.file=/etc/tempo.yaml"]
          ports:
            - containerPort: 4318
            - containerPort: 4317
            - containerPort: 3200
            - containerPort: 9095
          volumeMounts:
            - name: cfg
              mountPath: /etc/tempo.yaml
              subPath: tempo.yaml
      volumes:
        - name: cfg
          configMap:
            name: tempo-config
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: tempo-config
data:
  tempo.yaml: |
    server:
      http_listen_port: 3200
    distributor:
      receivers:
        otlp:
          protocols:
            http:
              endpoint: 0.0.0.0:4318
            grpc:
              endpoint: 0.0.0.0:4317
    ingester:
      trace_idle_period: 10s
      max_block_duration: 5m
    compactor:
      compaction:
        block_retention: 1h
    querier:
      frontend_worker:
        frontend_address: 127.0.0.1:9095
    query_frontend:
      search:
        duration_slo: 5s
    storage:
      trace:
        backend: local
        wal:
          path: /tmp/tempo/wal
        local:
          path: /tmp/tempo/blocks
