services:

  # ── Java Hello World app with JMX Exporter agent attached ─────────────────
  java-app:
    build:
      context: ./java-app
      dockerfile: Dockerfile
    container_name: hello-world-jmx
    ports:
      - "8080:8080"   # Hello World HTTP endpoint  →  http://localhost:8080
      - "9090:9090"   # JMX Exporter metrics        →  http://localhost:9090/metrics
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 5s
      retries: 5

  # ── Prometheus scrapes JMX metrics from java-app:9090 ────────────────────
  prometheus:
    image: prom/prometheus:latest
    container_name: prometheus
    ports:
      - "9091:9090"   # Prometheus UI  →  http://localhost:9091
    volumes:
      - ./prometheus/prometheus.yml:/etc/prometheus/prometheus.yml:ro
    command:
      - "--config.file=/etc/prometheus/prometheus.yml"
      - "--storage.tsdb.path=/prometheus"
      - "--web.console.libraries=/etc/prometheus/console_libraries"
      - "--web.console.templates=/etc/prometheus/consoles"
      - "--web.enable-lifecycle"
    depends_on:
      java-app:
        condition: service_healthy
